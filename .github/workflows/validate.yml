name: Validate Vesper
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/validate.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
