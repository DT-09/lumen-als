name: VESPER validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check application JavaScript syntax
        run: node --check web/assets/app.js
      - name: Validate web manifest and required assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from html.parser import HTMLParser

          root = Path("web")
          required = [
              root / "index.html",
              root / "assets/app.js",
              root / "assets/app.css",
              root / "manifest.webmanifest",
              root / "sw.js",
              root / "favicon.svg",
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"Missing required app files: {missing}")
          json.loads((root / "manifest.webmanifest").read_text())
          class DocumentCheck(HTMLParser):
              pass
          DocumentCheck().feed((root / "index.html").read_text())
          print("VESPER static app structure is valid.")
          PY
