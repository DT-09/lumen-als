name: VESPER CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check VESPER application syntax
        run: node --check web/assets/batlab.js
      - name: Check VESPER website shell and assets
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              "web/index.html",
              "web/assets/batlab.css",
              "web/assets/batlab.js",
              "web/manifest.webmanifest",
              "web/favicon.svg",
          ]
          for name in required:
              path = Path(name)
              assert path.is_file() and path.stat().st_size > 0, f"Missing or empty: {name}"
          html = Path("web/index.html").read_text(encoding="utf-8")
          assert "VESPER" in html
          assert "batlab.css" in html and "batlab.js" in html
          PY
      - name: Run verifier regression tests
        run: python -m pytest -q
