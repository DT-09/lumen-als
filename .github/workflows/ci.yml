name: STEMPROOF CI

on:
  push:
    branches: [main, stemproof-rebuild]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check JavaScript
        run: node --check web/assets/site.js
      - name: Check site pages and identity
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = ["index.html","platform.html","verification.html","workflows.html","benchmark.html","audit.html","docs.html","contact.html"]
          for page in pages:
              p=Path("web")/page
              assert p.exists(), f"Missing page: {p}"
              text=p.read_text(encoding="utf-8").lower()
              assert "stemproof" in text, f"Missing brand in {p}"
          candidates=[p for p in Path(".").rglob("*") if p.is_file() and ".git" not in p.parts and p.suffix.lower() in {".html",".py",".js",".md",".txt",".yml",".yaml",".json",".webmanifest",".svg",".bat"}]
          legacy=("pacelab","pacelabs","learning studio","learning in motion")
          matches=[(str(p),word) for p in candidates for word in legacy if word in p.read_text(encoding="utf-8",errors="ignore").lower()]
          if matches: raise SystemExit(f"Legacy identity references remain: {matches}")
          PY
      - name: Run tests
        run: python -m pytest -q
