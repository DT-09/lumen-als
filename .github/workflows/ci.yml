name: PaceLab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check frontend JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("web/index.html").read_text(encoding="utf-8")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/pacelab-frontend.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/pacelab-frontend.js
      - name: Check repository identity and canonical frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [p for p in Path(".").rglob("*") if p.is_file() and ".git" not in p.parts and p.suffix.lower() in {".html", ".py", ".js", ".md", ".txt", ".yml", ".yaml", ".json", ".webmanifest", ".svg"}]
          forbidden = ("lu" + "men", "hack" + "athon")
          matches = [(str(p), word) for p in files for word in forbidden if word in p.read_text(encoding="utf-8", errors="ignore").lower()]
          if matches:
              raise SystemExit(f"Forbidden legacy references: {matches}")
          assert Path("web/index.html").is_file()
          assert not Path("static/index.html").exists()
          PY
      - name: Run API and engine tests
        run: python -m pytest -q
      - name: Run retrieval evaluation
        run: python evaluate.py
